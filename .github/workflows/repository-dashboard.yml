name: Update repository dashboard

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify repositories and build dashboard
        run: node scripts/update-repo-dashboard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ndengafranck

      - name: Commit dashboard when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/images/repository-dashboard.svg
          if git diff --cached --quiet; then
            echo "Dashboard is unchanged."
            exit 0
          fi
          git commit -m "chore: update GitHub repository dashboard"
          git push
